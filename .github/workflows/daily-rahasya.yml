name: Daily Rahasya

on:
  workflow_dispatch:
    inputs:
      skip_episodes:
        description: "Comma-separated episode numbers to mark done before run (e.g. 1 or 1,2)"
        type: string
        default: ""
      use_repo_state:
        description: "Use data/rahasya.db from git (ignore pipeline-state artifact — for resets)"
        type: boolean
        default: false
      next_novel:
        description: "Permanently abandon current novel and start the next one (ep 1 of new book)"
        type: boolean
        default: false

concurrency:
  group: rahasya-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      METRICOOL_API_KEY: ${{ secrets.METRICOOL_API_KEY }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      CATBOX_USERHASH: ${{ secrets.CATBOX_USERHASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Set at least one LLM key: GEMINI_API_KEY, GROQ_API_KEY, or MISTRAL_API_KEY"
            exit 1
          fi
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$META_IG_USER_ID" ]; then
            echo "::error::META_ACCESS_TOKEN and META_IG_USER_ID are required for publishing"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
            echo "::warning::PEXELS_API_KEY and PIXABAY_API_KEY missing — stock footage may fail"
          fi
          if [ -z "$ELEVENLABS_API_KEY" ] && [ -z "$SARVAM_API_KEY" ] && [ -z "$FISH_AUDIO_API_KEY" ]; then
            echo "::warning::No TTS API keys set — voiceover will fall back to edge-tts"
          elif [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::ELEVENLABS_API_KEY missing — primary elevenlabs voice disabled"
          fi

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        id: state_cache
        with:
          path: output/stock_cache
          key: rahasya-state-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            rahasya-state-${{ github.ref }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install system dependencies
        timeout-minutes: 12
        run: bash scripts/gha_setup.sh system

      - name: Install Python dependencies
        timeout-minutes: 20
        env:
          INSTALL_ML: "1"
        run: bash scripts/gha_setup.sh python

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Write CI environment
        run: bash scripts/gha_setup.sh env

      - name: Restore pipeline state from artifact
        if: inputs.use_repo_state != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_pipeline_state.sh

      - name: Use repository pipeline state
        if: inputs.use_repo_state == true
        run: git checkout HEAD -- data/rahasya.db data/checkpoint.json

      - name: Verify Meta token
        if: env.META_ACCESS_TOKEN != ''
        run: python main.py meta-test || true

      - name: Skip completed episodes (manual override)
        if: inputs.skip_episodes != ''
        run: |
          IFS=',' read -ra EPS <<< "${{ inputs.skip_episodes }}"
          for ep in "${EPS[@]}"; do
            ep="$(echo "$ep" | xargs)"
            [ -z "$ep" ] && continue
            python main.py skip-episode --episode "$ep"
          done

      - name: Pipeline status before run
        run: python main.py status

      - name: Generate and publish episode
        run: |
          ARGS="--publish-now"
          if [ "${{ inputs.next_novel }}" = "true" ]; then
            echo "::notice::--next-novel enabled: abandoning current novel and switching queue"
            ARGS="$ARGS --next-novel"
          fi
          echo "Running: python main.py run $ARGS"
          python main.py run $ARGS

      - name: Upload pipeline state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            data/rahasya.db
            data/checkpoint.json
            data/novels/**/bgm.mp3
            data/novels/**/bgm.json
            data/novels/**/sfx/**
            output/review/
          retention-days: 90
          if-no-files-found: ignore

      - name: Save stock cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/stock_cache
          key: rahasya-state-${{ github.ref }}-${{ github.run_number }}

      - name: Upload latest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-episode-${{ github.run_number }}
          path: |
            output/posted/**/*
            output/ready_to_upload/**/*
            output/work/**/*
            logs/*.log
          retention-days: 14
          if-no-files-found: ignore
