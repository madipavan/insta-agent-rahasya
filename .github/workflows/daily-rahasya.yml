name: Daily Rahasya

on:
  schedule:
    # 6:00 PM IST = 12:30 UTC — generate, wait until 7:30 PM IST, then publish
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      skip_wait:
        description: "Skip wait until 7:30 PM IST (publish right after generate)"
        type: boolean
        default: true
      generate_only:
        description: "Generate only — do not publish"
        type: boolean
        default: false
      skip_episodes:
        description: "Comma-separated episode numbers to mark done before run (e.g. 1 or 1,2)"
        type: string
        default: ""

concurrency:
  group: rahasya-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      METRICOOL_API_KEY: ${{ secrets.METRICOOL_API_KEY }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Set at least one LLM key: GEMINI_API_KEY, GROQ_API_KEY, or MISTRAL_API_KEY"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "::warning::PEXELS_API_KEY secret is missing — stock footage may fail"
          fi

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        id: state_cache
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}-${{ github.run_number }}
          restore-keys: |
            rahasya-state-${{ github.ref }}-

      - name: Report cache status
        run: |
          echo "cache-hit=${{ steps.state_cache.outputs.cache-hit }}"
          ls -la data/ 2>/dev/null || echo "no data/ yet"
          ls -la data/rahasya.db 2>/dev/null || echo "no rahasya.db yet"
          ls -la data/checkpoint.json 2>/dev/null || echo "no checkpoint.json yet"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install system dependencies
        timeout-minutes: 12
        run: bash scripts/gha_setup.sh system

      - name: Install Python dependencies
        timeout-minutes: 20
        env:
          INSTALL_ML: "1"
        run: bash scripts/gha_setup.sh python

      - name: Write CI environment
        run: bash scripts/gha_setup.sh env

      - name: Restore database from previous artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_pipeline_db.sh

      - name: Verify Meta token
        if: env.META_ACCESS_TOKEN != ''
        run: python main.py meta-test || true

      - name: Skip completed episodes (manual override)
        if: inputs.skip_episodes != ''
        run: |
          IFS=',' read -ra EPS <<< "${{ inputs.skip_episodes }}"
          for ep in "${EPS[@]}"; do
            ep="$(echo "$ep" | xargs)"
            [ -z "$ep" ] && continue
            python main.py skip-episode --episode "$ep"
          done

      - name: Pipeline status before run
        run: python main.py status

      - name: Generate episode
        run: python main.py run

      - name: Upload pipeline database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-db
          path: |
            data/rahasya.db
            data/checkpoint.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Save pipeline state (post-generate)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}-${{ github.run_number }}

      - name: Wait until 7:30 PM IST
        if: |
          inputs.generate_only != true &&
          (github.event_name == 'schedule' || inputs.skip_wait != true)
        run: python scripts/wait_until_post_time.py

      - name: Publish to Instagram
        if: inputs.generate_only != true
        run: |
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$META_IG_USER_ID" ]; then
            echo "::error::META_ACCESS_TOKEN and META_IG_USER_ID are required for publishing"
            exit 1
          fi
          echo "Pending publish bundles:"
          PENDING=$(python -c "from src.config import load_config; from src.pipeline.publisher import pending_publish_count; print(pending_publish_count(load_config()))")
          echo "$PENDING"
          if [ "$PENDING" = "0" ]; then
            echo "::error::No bundles in pending_publish queue after generate step"
            exit 1
          fi
          python main.py publish --now

      - name: Save pipeline state (final)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}-${{ github.run_number }}

      - name: Upload latest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-episode-${{ github.run_number }}
          path: |
            output/posted/**/*
            output/ready_to_upload/**/*
            output/work/**/*
            logs/*.log
          retention-days: 14
          if-no-files-found: ignore
