name: Daily Pipeline

on:
  schedule:
    # 5:00 PM IST = 11:30 UTC — generate content only (publish at 7:30 PM next day)
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      publish_immediately:
        description: "Publish to Instagram right after generate (skip 20h wait)"
        type: boolean
        default: true

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      METRICOOL_API_KEY: ${{ secrets.METRICOOL_API_KEY }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Set GROQ_API_KEY or GEMINI_API_KEY in Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "::warning::PEXELS_API_KEY secret is missing — stock footage may fail"
          fi

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        id: state_cache
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}
          restore-keys: |
            rahasya-state-${{ github.ref }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install system dependencies
        timeout-minutes: 12
        run: bash scripts/gha_setup.sh system

      - name: Install Python dependencies
        timeout-minutes: 20
        run: bash scripts/gha_setup.sh python

      - name: Write CI environment
        run: bash scripts/gha_setup.sh env

      - name: Verify Meta token
        if: env.META_ACCESS_TOKEN != ''
        run: python main.py meta-test || true

      - name: Run pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_immediately }}" = "true" ]; then
            python main.py run --publish-now
          else
            python main.py run
          fi

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}

      - name: Upload latest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-episode-${{ github.run_number }}
          path: |
            output/posted/**/*
            output/ready_to_upload/**/*
            output/work/**/*
            logs/*.log
          retention-days: 14
          if-no-files-found: ignore
