brand:
  bg_color: "#0A0E1A"
  accent_color: "#C41E3A"
  text_color: "#F5F5F5"
  display_font: "assets/fonts/BebasNeue-Regular.ttf"
  body_font: "assets/fonts/Inter-Regular.ttf"
  quote_font: "C:/Windows/Fonts/georgiab.ttf"
  caption_font: "assets/fonts/AnekDevanagari-ExtraBold.ttf"
  hindi_quote_font: "assets/fonts/NotoSerifDevanagari-Regular.ttf"
  # Compact bilingual (Hindi + English) burned-in captions
  caption_font_size: 34
  hook_font_size: 38
  english_caption_font_size: 28
  caption_outline: 3
  watermark_text: "Rahasya.exe"
  logo_path: "assets/brand/logo.png"
  intro_duration_sec: 1.0
  outro_duration_sec: 1.0

llm_provider: gemini
llm_fallback_providers:
  - groq
  - mistral
llm_model_grok: grok-3-mini
llm_model_groq: llama-3.3-70b-versatile
llm_model_gemini: gemini-2.5-flash
llm_model_mistral: mistral-small-latest
llm_model_anthropic: claude-sonnet-4-20250514
llm_model_openai: gpt-4o
max_episodes: 12

post_time: "19:30"
timezone: "Asia/Kolkata"

# Voice: ElevenLabs Viraj (primary) → Sarvam shubh → Edge MadhurNeural (male chain)
voice_provider: elevenlabs
voice_name: Viraj
edge_tts_voice: "hi-IN-MadhurNeural"
voice_language: hindi
# ElevenLabs Creator — https://elevenlabs.io/app/developers/api-keys
voice_id: "P1bg08DkjqiVEzOn76yG"  # Viraj — Suspenseful and Engaging Narrator
elevenlabs_model: eleven_multilingual_v2
elevenlabs_stability: 0.35
elevenlabs_similarity_boost: 0.75
elevenlabs_style: 0.55
elevenlabs_sentence_mode: true
elevenlabs_cliffhanger_whisper: true
elevenlabs_fallback: true
# Reuse cached voiceover on pipeline retry — saves ElevenLabs credits
voiceover_cache: true
# Sarvam AI — https://dashboard.sarvam.ai (₹100 free credits on signup)
sarvam_model: bulbul:v3
sarvam_speaker: shubh
sarvam_language_code: hi-IN
sarvam_pace: 0.90
sarvam_temperature: 0.75
sarvam_fallback: true
# Fish Audio disabled — avoid unknown-gender failover swapping narrator
fish_audio_model: s2.1-pro-free
fish_audio_voice_id: "bc2253b3f34e4b769cb87636db31a2c7"
fish_audio_speed: 0.80
fish_audio_temperature: 0.85
fish_audio_latency: normal
fish_audio_sentence_mode: true
fish_audio_sentence_pause_sec: 0.35
fish_audio_fallback: false

# Target ~80s voiceover (+ intro/outro cards ≈ 82s total reel)
script_min_seconds: 75
script_max_seconds: 80

# Expressive dubbing-style TTS (edge-tts prosody) — slightly less slow for Hinglish density
edge_tts_rate: "-4%"
edge_tts_pitch: "-2Hz"

cta: "Follow for the next part 👀"
brand_hashtag: "#RahasyaExe"
hashtags: "#thrillerbooks #suspensenovel #bookstagram #RahasyaExe #booktok"
stock_style_tag: "noir lighting, teal-blue color grade, cinematic"
review_required: false
# false = generate now, publish later via `python main.py publish` (or publish workflow at post_time)
auto_publish: false
min_publish_delay_hours: 20

# Posting provider: "meta" (Instagram Graph API) or "metricool"
post_provider: meta

discovery:
  min_queue_size: 1
  batch_size: 5

caption_template: |
  {caption_hook}

  {caption_teaser}

  Part {episode}/{total} of "{novel_title}"
  {cta}

  {hashtags}

static_post:
  width: 1080
  height: 1350
  layout_rotation: quote
  # ~88 chars × 10 slides ≈ full 80s reel script (750–880 Hinglish chars)
  chars_per_slide: 88
  max_slides: 10
  # Compact bilingual Hindi + English on carousel slides
  quote_font_size_max: 30
  quote_font_size_min: 22
  english_quote_font_size_max: 24
  english_quote_font_size_min: 18
  hindi_bold: false
  text_stroke_width: 1
  max_lines_per_slide: 12
  text_area_ratio: 0.70

video:
  width: 1080
  height: 1920
  fps: 30
  clip_count: 4
  photo_count: 1
  artistic_stock: true
  # Stock fetch order: local library → Pixabay → Pexels
  stock_providers:
    - local
    - pixabay
    - pexels
  bgm_volume: 0.24
  voiceover_volume: 1.2
  # Retention SFX mixed under voiceover (hook, cut whooshes, cliffhanger sting)
  sfx_enabled: true
  sfx_hook_volume: 0.28
  sfx_whoosh_volume: 0.18
  sfx_cliffhanger_volume: 0.24
  sfx_cliffhanger_before_end_sec: 8.0
  # Generate per-novel ElevenLabs music + SFX once; reuse for all episodes
  elevenlabs_audio_enabled: true
  elevenlabs_music_length_ms: 30000
  elevenlabs_music_model: music_v1

# Top-level mirrors used by AppConfig loaders
elevenlabs_music_length_ms: 30000
elevenlabs_music_model: music_v1

paths:
  data_dir: data
  db_path: data/rahasya.db
  output_dir: output
  logs_dir: logs
  stock_library: assets/stock_library
  sfx_library: assets/sfx_library
  voiceover_cache_dir: output/voiceover_cache
  sample_scripts: data/sample_scripts
  novels_seed: data/novels_seed.json
  novels_pdf_dir: data/novels
