name: Daily Publish

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC — posts queued bundle from yesterday's generate
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      publish_immediately:
        description: "Skip 20h delay and publish now (for testing)"
        type: boolean
        default: true

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}
          restore-keys: |
            rahasya-state-${{ github.ref }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install system dependencies
        timeout-minutes: 12
        run: bash scripts/gha_setup.sh system

      - name: Install Python dependencies
        timeout-minutes: 20
        env:
          INSTALL_ML: "1"
        run: bash scripts/gha_setup.sh python

      - name: Write CI environment
        run: bash scripts/gha_setup.sh env

      - name: Check Meta secrets
        run: |
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$META_IG_USER_ID" ]; then
            echo "::error::META_ACCESS_TOKEN and META_IG_USER_ID are required for publishing"
            exit 1
          fi

      - name: Verify Meta token
        if: env.META_ACCESS_TOKEN != ''
        run: python main.py meta-test || true

      - name: Publish to Instagram
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_immediately }}" = "true" ]; then
            OUT=$(python main.py publish --now 2>&1) || true
            echo "$OUT"
            if echo "$OUT" | grep -q "Nothing to publish"; then
              if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
                echo "::error::No bundle to publish and no LLM key for generate fallback (set GEMINI_API_KEY or GROQ_API_KEY)"
                exit 1
              fi
              echo "No bundle in queue — generating episode and publishing now..."
              python main.py run --publish-now
            fi
          else
            python main.py publish
          fi

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
          key: rahasya-state-${{ github.ref }}-${{ github.run_id }}
